<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pocket Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a compact calculator body with a running tape of past results beside it; the tape drops below on narrow screens. */
:root {
  --bg: #e9eef1;
  --body: #f7f9fa;
  --fg: #14232b;
  --muted: #5d7380;
  --key: #ffffff;
  --key-fg: #14232b;
  --key-op: #d9e6ea;
  --key-op-fg: #0b4f5c;
  --key-fn: #eef2f4;
  --accent: #0e7c8f;
  --accent-fg: #ffffff;
  --line: #cfdae0;
  --shadow: 0 1px 0 #ffffff inset, 0 10px 30px -12px rgba(20, 35, 43, 0.25);
  --font-ui: "Familjen Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171c;
    --body: #14232b;
    --fg: #e6f0f3;
    --muted: #8aa4b0;
    --key: #1c303a;
    --key-fg: #e6f0f3;
    --key-op: #23414d;
    --key-op-fg: #8fe0ee;
    --key-fn: #182a33;
    --accent: #36b9cf;
    --accent-fg: #07181d;
    --line: #29414d;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 14px 34px -14px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171c;
  --body: #14232b;
  --fg: #e6f0f3;
  --muted: #8aa4b0;
  --key: #1c303a;
  --key-fg: #e6f0f3;
  --key-op: #23414d;
  --key-op-fg: #8fe0ee;
  --key-fn: #182a33;
  --accent: #36b9cf;
  --accent-fg: #07181d;
  --line: #29414d;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 14px 34px -14px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  padding-inline: 16px;
  padding-block: 28px;
  min-height: 100%;
}
.shell {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  align-items: flex-start;
  max-width: 760px;
  margin-inline: auto;
}
.calc {
  flex: 1 1 320px;
  max-width: 360px;
  min-width: 0;
  background: var(--body);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.screen {
  min-height: 118px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  gap: 6px;
  padding: 8px 6px 16px;
  position: relative;
}
.expr {
  font-family: var(--font-num);
  font-size: 17px;
  color: var(--muted);
  max-width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  min-height: 24px;
  scrollbar-width: none;
}
.expr::-webkit-scrollbar { display: none; }
.result {
  font-family: var(--font-num);
  font-weight: 500;
  font-size: 40px;
  line-height: 1.1;
  letter-spacing: -0.02em;
  max-width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  scrollbar-width: none;
}
.result::-webkit-scrollbar { display: none; }
.result.error { font-size: 22px; color: var(--muted); }
.back {
  position: absolute;
  top: 4px;
  left: 4px;
  font: 500 13px var(--font-ui);
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
}
.back:hover { color: var(--fg); border-color: var(--muted); }

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.keys button {
  font-family: var(--font-num);
  font-size: 22px;
  font-weight: 500;
  height: 62px;
  border: 0;
  border-radius: 16px;
  background: var(--key);
  color: var(--key-fg);
  box-shadow: 0 0 0 1px var(--line) inset;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.12s ease;
}
.keys button:hover { filter: brightness(0.97); }
.keys button:active, .keys button.press { transform: scale(0.95); }
.keys button.fn { background: var(--key-fn); color: var(--muted); }
.keys button.op { background: var(--key-op); color: var(--key-op-fg); }
.keys button.eq { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
.keys button:focus-visible, .back:focus-visible, .tape li button:focus-visible, .clear:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.tape {
  flex: 1 1 240px;
  max-width: 360px;
  min-width: 0;
  padding-top: 6px;
}
.tape-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.tape h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.clear {
  font: 500 13px var(--font-ui);
  color: var(--muted);
  background: none;
  border: 0;
  cursor: pointer;
  padding: 4px;
}
.clear:hover { color: var(--fg); }
.tape ul { list-style: none; margin: 0; padding: 0; }
.tape li button {
  width: 100%;
  text-align: right;
  background: none;
  border: 0;
  border-top: 1px dashed var(--line);
  padding: 12px 2px;
  cursor: pointer;
  color: var(--fg);
  font-family: var(--font-num);
}
.tape li button:hover { background: var(--key-fn); }
.tape .t-expr { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tape .t-res { display: block; font-size: 20px; font-weight: 500; margin-top: 2px; }
.tape .empty {
  border-top: 1px dashed var(--line);
  padding: 14px 2px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  max-width: 34ch;
}
.hint { margin-top: 14px; color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 40ch; }
kbd { font-family: var(--font-num); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
@media (prefers-reduced-motion: reduce) {
  .keys button { transition: none; }
}
</style>

<div class="shell">
  <main class="calc" aria-label="Calculator">
    <div class="screen" aria-live="polite">
      <button class="back" id="back" type="button" aria-label="Delete last character">⌫ Delete</button>
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn" data-k="clear" type="button">AC</button>
      <button class="fn" data-k="paren" type="button" aria-label="Parenthesis">( )</button>
      <button class="fn" data-k="%" type="button" aria-label="Percent">%</button>
      <button class="op" data-k="÷" type="button" aria-label="Divide">÷</button>

      <button data-k="7" type="button">7</button>
      <button data-k="8" type="button">8</button>
      <button data-k="9" type="button">9</button>
      <button class="op" data-k="×" type="button" aria-label="Multiply">×</button>

      <button data-k="4" type="button">4</button>
      <button data-k="5" type="button">5</button>
      <button data-k="6" type="button">6</button>
      <button class="op" data-k="−" type="button" aria-label="Subtract">−</button>

      <button data-k="1" type="button">1</button>
      <button data-k="2" type="button">2</button>
      <button data-k="3" type="button">3</button>
      <button class="op" data-k="+" type="button" aria-label="Add">+</button>

      <button class="fn" data-k="neg" type="button" aria-label="Change sign">±</button>
      <button data-k="0" type="button">0</button>
      <button data-k="." type="button">.</button>
      <button class="eq" data-k="=" type="button" aria-label="Equals">=</button>
    </div>
  </main>

  <aside class="tape" aria-label="History">
    <div class="tape-head">
      <h2>Tape</h2>
      <button class="clear" id="clearTape" type="button">Clear</button>
    </div>
    <ul id="tape"></ul>
    <p class="hint">Type on your keyboard too: digits, <kbd>+ - * /</kbd>, <kbd>( )</kbd>, <kbd>%</kbd>, <kbd>Enter</kbd> to calculate, <kbd>Backspace</kbd> to delete, <kbd>Esc</kbd> to clear.</p>
  </aside>
</div>

<script>
(function () {
  var OPS = "+−×÷";
  var expr = "1250×12%"; // sample so the calculator opens in a working state
  var fresh = false;      // true right after "=", so the next digit starts over
  var tape = [];

  var exprEl = document.getElementById("expr");
  var resEl = document.getElementById("result");
  var tapeEl = document.getElementById("tape");

  function tokenize(s) {
    var out = [], re = /\s*(\d*\.?\d+|\d+\.|[+−\-×÷*\/()%])/y, m, pos = 0;
    while (pos < s.length) {
      re.lastIndex = pos;
      m = re.exec(s);
      if (!m) throw new Error("bad");
      out.push(m[1]);
      pos = re.lastIndex;
    }
    return out;
  }

  function evaluate(s) {
    var t = tokenize(s), i = 0;
    function peek() { return t[i]; }
    function next() { return t[i++]; }
    function primary() {
      var tok = next();
      if (tok === undefined) throw new Error("bad");
      if (tok === "(") {
        var v = sum();
        if (next() !== ")") throw new Error("bad");
        return v;
      }
      if (/^\d|^\./.test(tok)) return parseFloat(tok);
      throw new Error("bad");
    }
    function postfix() {
      var v = primary();
      while (peek() === "%") { next(); v = v / 100; }
      return v;
    }
    function unary() {
      var tok = peek();
      if (tok === "−" || tok === "-") { next(); return -unary(); }
      if (tok === "+") { next(); return unary(); }
      return postfix();
    }
    function product() {
      var v = unary();
      while (peek() === "×" || peek() === "*" || peek() === "÷" || peek() === "/") {
        var op = next();
        var r = unary();
        if (op === "×" || op === "*") v = v * r;
        else {
          if (r === 0) throw new Error("div0");
          v = v / r;
        }
      }
      return v;
    }
    function sum() {
      var v = product();
      while (peek() === "+" || peek() === "−" || peek() === "-") {
        var op = next();
        var r = product();
        v = op === "+" ? v + r : v - r;
      }
      return v;
    }
    var result = sum();
    if (i < t.length) throw new Error("bad");
    return parseFloat(result.toPrecision(12));
  }

  function closeParens(s) {
    var open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    return s + ")".repeat(Math.max(0, open));
  }
  function fmt(n) {
    try { return n.toLocaleString(undefined, { maximumFractionDigits: 10 }); }
    catch (e) { return String(n); }
  }
  function tryEval(s) {
    var c = closeParens(s).replace(/[+−×÷]+$/, "");
    if (!c) return null;
    try {
      var v = evaluate(c);
      return isFinite(v) ? { value: v } : null;
    } catch (e) {
      return e.message === "div0" ? { error: "Cannot divide by zero" } : null;
    }
  }

  function render() {
    exprEl.textContent = expr;
    exprEl.scrollLeft = exprEl.scrollWidth;
    resEl.classList.remove("error");
    if (!expr) { resEl.textContent = "0"; return; }
    var r = tryEval(expr);
    if (r && r.error) { resEl.textContent = r.error; resEl.classList.add("error"); }
    else if (r) resEl.textContent = fmt(r.value);
    else resEl.textContent = "";
  }

  function renderTape() {
    tapeEl.innerHTML = "";
    if (!tape.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Press = and each calculation is kept here. Tap one to use its answer again.";
      tapeEl.appendChild(li);
      return;
    }
    tape.forEach(function (item) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="t-expr"></span><span class="t-res"></span>';
      b.children[0].textContent = item.expr + " =";
      b.children[1].textContent = fmt(item.value);
      b.addEventListener("click", function () { expr = String(item.value); fresh = true; render(); });
      li.appendChild(b);
      tapeEl.appendChild(li);
    });
  }

  function lastChar() { return expr.slice(-1); }
  function endsWithNumber() { return /[\d.%)]$/.test(expr); }

  function press(k) {
    if (/^\d$/.test(k)) {
      if (fresh) { expr = ""; fresh = false; }
      if (lastChar() === ")" || lastChar() === "%") expr += "×";
      expr += k;
    } else if (k === ".") {
      if (fresh) { expr = ""; fresh = false; }
      var seg = expr.split(/[+−×÷()%]/).pop();
      if (seg.indexOf(".") !== -1) return;
      expr += seg === "" ? "0." : ".";
    } else if (OPS.indexOf(k) !== -1) {
      fresh = false;
      if (!expr) { if (k === "−") expr = "−"; return; }
      if (OPS.indexOf(lastChar()) !== -1) expr = expr.slice(0, -1) + k;
      else if (lastChar() === "(") { if (k === "−") expr += "−"; }
      else expr += k;
    } else if (k === "%") {
      fresh = false;
      if (/[\d)%]$/.test(expr)) expr += "%";
    } else if (k === "paren") {
      fresh = false;
      var open = (expr.match(/\(/g) || []).length - (expr.match(/\)/g) || []).length;
      if (open > 0 && /[\d)%]$/.test(expr)) expr += ")";
      else { if (/[\d)%]$/.test(expr)) expr += "×"; expr += "("; }
    } else if (k === "(" || k === ")") {
      press("paren");
      return;
    } else if (k === "neg") {
      fresh = false;
      var m = expr.match(/\(−(\d*\.?\d+)\)$/);
      if (m) expr = expr.slice(0, m.index) + m[1];
      else {
        var n = expr.match(/(\d*\.?\d+)$/);
        if (n) expr = expr.slice(0, n.index) + "(−" + n[1] + ")";
        else if (!expr) expr = "(−";
      }
    } else if (k === "back") {
      if (fresh) { expr = ""; fresh = false; }
      else expr = expr.slice(0, -1);
    } else if (k === "clear") {
      expr = ""; fresh = false;
    } else if (k === "=") {
      var r = tryEval(expr);
      if (r && r.value !== undefined) {
        var shown = closeParens(expr).replace(/[+−×÷]+$/, "");
        tape.unshift({ expr: shown, value: r.value });
        if (tape.length > 30) tape.pop();
        expr = String(r.value);
        fresh = true;
        renderTape();
      }
    }
    render();
  }

  document.getElementById("keys").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-k]");
    if (b) press(b.getAttribute("data-k"));
  });
  document.getElementById("back").addEventListener("click", function () { press("back"); });
  document.getElementById("clearTape").addEventListener("click", function () { tape = []; renderTape(); });

  var keyMap = { "*": "×", "/": "÷", "-": "−", "+": "+", "x": "×", "X": "×" };
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, target = null;
    if (/^\d$/.test(k) || k === ".") target = k;
    else if (keyMap[k]) target = keyMap[k];
    else if (k === "%") target = "%";
    else if (k === "(" || k === ")") target = "paren";
    else if (k === "Enter" || k === "=") target = "=";
    else if (k === "Backspace") target = "back";
    else if (k === "Escape" || k === "Delete") target = "clear";
    if (target === null) return;
    if (k === "Enter" && document.activeElement && document.activeElement.tagName === "BUTTON") return;
    e.preventDefault();
    press(target);
    var btn = document.querySelector('#keys button[data-k="' + (target === "back" ? "clear" : target) + '"]');
    if (btn && target !== "back") {
      btn.classList.add("press");
      setTimeout(function () { btn.classList.remove("press"); }, 110);
    }
  });

  render();
  renderTape();
})();
</script>

</body></html>
